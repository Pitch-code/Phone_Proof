# The one place the app's version is written down.
#
# Every release before this file existed shipped an APK that said "0.1.0" inside it, whatever the tag on
# the download said — v0.2.1, v0.3.0 and v0.4.0 all carried versionCode 1 and versionName 0.1.0, because
# both were hardcoded in app/build.gradle.kts and nobody remembered to touch them. Every diagnostics log
# and every saved report from those builds therefore names the wrong version, which is exactly the moment
# a version number is supposed to earn its keep.
#
# How this works now:
#
#  - versionName below is the only thing edited by hand. MAJOR.MINOR.PATCH, no suffixes.
#  - versionCode is derived from it (MAJOR*10000 + MINOR*100 + PATCH), so the two cannot disagree.
#    Play only cares that it increases, and this increases whenever the name does.
#  - CI refuses to publish a tag whose name does not match this file, so the APK cannot be handed out
#    under a version it does not carry inside.
#
# Bump this in the same commit that is worth releasing, then tag it. MINOR and PATCH must stay under 100,
# which the build enforces.
versionName=0.5.0
