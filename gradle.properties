org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# The Kotlin compile daemon runs in its own JVM and does not inherit org.gradle.jvmargs. Left at
# its default it died with "Daemon compilation failed: null" when several modules compiled at once,
# which then surfaced as a bogus "unresolved reference" in whichever module happened to be running.
# A build that fails for reasons unrelated to the code is worse than a slow one: it teaches you to
# re-run instead of to read the error.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Roborazzi renders Compose on the JVM via Robolectric. This sandbox has no /dev/kvm,
# so there is no emulator — JVM screenshots are the only way to see the UI, and they
# are how every screen gets reviewed before anyone installs an APK.
robolectric.graphicsMode=NATIVE
