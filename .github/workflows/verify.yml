name: Verify

# Runs on every push and pull request, unlike a manual-only APK build.
#
# The point is that a change cannot be called done without evidence: this compiles, runs the unit
# tests, and re-renders every screen to PNG. The screenshots are uploaded as an artifact so UI can
# be reviewed without installing anything.
on:
  push:
    branches: ["**"]
    # Tags build too, because a tag is how an installable APK gets published. See the release job.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, render screens
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the tag matches the version in the repo
        # Only on a tag, because only a tag publishes anything.
        #
        # The APK is named after the tag, and its contents are named after version.properties. Nothing used
        # to make those agree, which is how v0.2.1, v0.3.0 and v0.4.0 were all handed out as downloads whose
        # insides said 0.1.0. Checked before the build rather than after, so a mistyped tag fails in seconds
        # instead of at the end of a ten-minute run.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ -z "$declared" ]; then
            echo "::error::version.properties does not declare versionName."
            exit 1
          fi
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName=${declared} in version.properties."
            echo "Publishing would hand out an APK under a version it does not carry inside."
            echo "Either bump version.properties to ${tagged} and re-tag, or tag v${declared} instead."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versionName=${declared}."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile everything
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile the release variant, shrinker and all
        # The variant that goes to Play, which until now had never been built here at all.
        #
        # Two things depend on this. R8 and resource shrinking only run on release, so a rule that breaks
        # them was previously invisible; and the debug-only tier switcher has a do-nothing twin in
        # feature/settings/src/release that the debug build never compiles. Without this step that twin
        # could rot, and the first person to find out would be whoever tried to publish.
        #
        # Unsigned on purpose: no release keystore enters this repo, and assembling is enough to prove the
        # thing compiles and shrinks.
        run: ./gradlew assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Render screens to PNG
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Fail if a screen changed without its screenshot being updated
        # A UI change that does not update its committed PNG means the change was never looked at.
        run: |
          set -euo pipefail
          # `git status --porcelain`, not `git diff`. `git diff` only sees files git already tracks, so a
          # brand-new screen with a brand-new render passed this gate silently — which is the one case the
          # gate most needs to catch, a screen nobody has ever looked at. Not hypothetical: the "· Premium"
          # marker on the checks list shipped through a green run of this exact step.
          drift="$(git status --porcelain --untracked-files=all -- screenshots/)"
          if [ -n "$drift" ]; then
            echo "::error::Rendered screenshots differ from the committed ones."
            echo "Run './gradlew recordRoborazziDebug', review the PNGs, and commit them."
            echo "$drift"
            exit 1
          fi
          echo "Screenshots match the committed renders."

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Build the signed release bundle
        # The AAB is what Play accepts; the APK attached to a release is for sideloading and cannot be
        # uploaded to the Console. Tags only, because this is the one moment a private key is needed.
        #
        # Skips with a warning rather than failing when the secret is absent, so tagging keeps working
        # before the upload key exists. It cannot skip *silently*: an unsigned bundle is useless, and the
        # only thing worse than not producing it is producing one that looks fine and is rejected on upload.
        #
        # The keystore is a GitHub secret holding base64, because a secret is text and a keystore is not. It
        # is written under RUNNER_TEMP, outside the workspace, so it can never be picked up by a build step
        # or committed by accident.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PHONEPROOF_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          PHONEPROOF_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PHONEPROOF_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret, so no App Bundle was built."
            echo "The release will carry only the sideloadable debug APK. See RELEASING.md to set the key up."
            exit 0
          fi
          keystore="${RUNNER_TEMP}/upload-key.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          # Proves the secret decoded to a real keystore before Gradle reports it as a password problem.
          keytool -list -keystore "$keystore" -storepass "$PHONEPROOF_KEYSTORE_PASSWORD" > /dev/null
          echo "Keystore decoded and opened."
          PHONEPROOF_KEYSTORE_FILE="$keystore" ./gradlew bundleRelease --stacktrace
          shred -u "$keystore" 2>/dev/null || rm -f "$keystore"
          ls -la app/build/outputs/bundle/release/

      - name: Upload the App Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          # Ignored rather than error: no key configured yet is a supported state, and the step above has
          # already said so loudly.
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # Publishing the APK so it can be installed on a real phone by tapping one link.
  #
  # This exists because a GitHub Actions artifact is a poor way to hand someone a build: the download
  # needs a GitHub login, and it arrives as a zip that a phone will not install without a file
  # manager. A release asset is a direct download that Android opens straight into the installer.
  #
  # It is a separate job purely to keep least privilege. Attaching an asset needs `contents: write`,
  # and the build job that runs on every push and every pull request has no business holding a write
  # token; this one only ever runs for a tag. It also depends on `verify`, so nothing can be published
  # that did not compile, pass its tests and match its committed screenshots.
  release:
    name: Attach the APK to the release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the APK that passed
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Download the App Bundle, if one was built
        # Absent whenever no upload key is configured, which must not fail the release: the sideloadable
        # APK is still worth publishing on its own.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: apk

      - name: Name them after the tag
        # app-debug.apk tells whoever downloads it nothing about which build they have.
        run: |
          set -euo pipefail
          mv apk/app-debug.apk "apk/phoneproof-${GITHUB_REF_NAME}.apk"
          # Only present when the bundle was built. Named to say plainly that this one is not installable,
          # because an .aab looks like just another download and Android will refuse to open it.
          if [ -f apk/app-release.aab ]; then
            mv apk/app-release.aab "apk/phoneproof-${GITHUB_REF_NAME}-for-play-upload.aab"
          fi
          ls -la apk/

      - name: Attach them
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/*.apk
            apk/*.aab
          # False because the .aab line matches nothing until an upload key exists, and a release with the
          # APK attached is still exactly what it was before.
          fail_on_unmatched_files: false
          # The release is usually created before the tag is pushed, and this must not blank its notes.
          append_body: false
