name: Verify

# Runs on every push and pull request, unlike a manual-only APK build.
#
# The point is that a change cannot be called done without evidence: this compiles, runs the unit
# tests, and re-renders every screen to PNG. The screenshots are uploaded as an artifact so UI can
# be reviewed without installing anything.
on:
  push:
    branches: ["**"]
    # Tags build too, because a tag is how an installable APK gets published. See the release job.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, render screens
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile everything
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile the release variant, shrinker and all
        # The variant that goes to Play, which until now had never been built here at all.
        #
        # Two things depend on this. R8 and resource shrinking only run on release, so a rule that breaks
        # them was previously invisible; and the debug-only tier switcher has a do-nothing twin in
        # feature/settings/src/release that the debug build never compiles. Without this step that twin
        # could rot, and the first person to find out would be whoever tried to publish.
        #
        # Unsigned on purpose: no release keystore enters this repo, and assembling is enough to prove the
        # thing compiles and shrinks.
        run: ./gradlew assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Render screens to PNG
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Fail if a screen changed without its screenshot being updated
        # A UI change that does not update its committed PNG means the change was never looked at.
        run: |
          set -euo pipefail
          if ! git diff --quiet -- screenshots/; then
            echo "::error::Rendered screenshots differ from the committed ones."
            echo "Run './gradlew recordRoborazziDebug', review the PNGs, and commit them."
            git diff --stat -- screenshots/
            exit 1
          fi
          echo "Screenshots match the committed renders."

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # Publishing the APK so it can be installed on a real phone by tapping one link.
  #
  # This exists because a GitHub Actions artifact is a poor way to hand someone a build: the download
  # needs a GitHub login, and it arrives as a zip that a phone will not install without a file
  # manager. A release asset is a direct download that Android opens straight into the installer.
  #
  # It is a separate job purely to keep least privilege. Attaching an asset needs `contents: write`,
  # and the build job that runs on every push and every pull request has no business holding a write
  # token; this one only ever runs for a tag. It also depends on `verify`, so nothing can be published
  # that did not compile, pass its tests and match its committed screenshots.
  release:
    name: Attach the APK to the release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the APK that passed
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Name it after the tag
        # app-debug.apk tells whoever downloads it nothing about which build they have.
        run: |
          set -euo pipefail
          mv apk/app-debug.apk "apk/phoneproof-${GITHUB_REF_NAME}.apk"
          ls -la apk/

      - name: Attach it
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          fail_on_unmatched_files: true
          # The release is usually created before the tag is pushed, and this must not blank its notes.
          append_body: false
