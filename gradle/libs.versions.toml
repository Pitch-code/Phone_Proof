#
# Every version below was verified to exist on Google Maven / Maven Central before
# being written here. Do not bump a version without checking maven-metadata.xml first —
# guessing versions is how builds break.
#
[versions]
agp = "8.13.2"
kotlin = "2.2.21"

# compileSdk 36 deliberately. Platforms are minor-versioned now (android-37.0 / android-37.1),
# and AGP 8.13 resolves the major-only form, so 36 is the safe compile target.
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

composeBom = "2026.06.01"
coreKtx = "1.18.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
navigationCompose = "2.9.8"
coroutines = "1.11.0"
datastore = "1.2.1"
# Play now rejects new releases built against Billing Library 7 or lower: from 1 Nov 2026 an update on
# 7.x cannot be published at all (the Console flagged this app, extension granted to that date). 8.x is
# the floor. Staying on the 8 line rather than jumping to 9 on purpose — the only call this app makes
# that 8 deprecated is ProductDetails.oneTimePurchaseOfferDetails, which 8 still ships and 9 removes, so
# 8 is the version where the existing code compiles untouched. None of the APIs 8 *removed*
# (querySkuDetailsAsync, the no-arg enablePendingPurchases, the String queryPurchasesAsync overload,
# queryPurchaseHistoryAsync) are used here — checked before bumping.
#
# Version not verifiable against Google Maven from this sandbox (no outbound network to it), so CI is the
# check: dependency resolution fails fast in the PR build if this string is wrong.
billing = "8.0.0"
# AndroidX Biometric. 1.1.0 is the long-standing stable release; it wraps canAuthenticate across every API
# level this app supports (26+), so the fingerprint/face capability read works without version branching.
# Not verifiable against Google Maven from this sandbox — CI resolves it and fails fast if the string is wrong.
biometric = "1.1.0"
kotlinxSerialization = "1.9.0"

junit = "4.13.2"
truth = "1.4.5"
robolectric = "4.16.1"
roborazzi = "1.71.0"

[libraries]
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Version comes from the Compose BOM. icons-core only, not icons-extended: extended is thousands of
# vectors and adds megabytes, and this app needs one gear.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
